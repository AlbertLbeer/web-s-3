<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="鲁博的前端网页作品集，展示食谱搜索、趣味答题和注册页面三个前端作品。"
    />
    <title>鲁博的前端网页作品集</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="ambient-light" aria-hidden="true"></div>

    <main class="portfolio">
      <header class="hero">
        <h1>鲁博的前端网页作品集</h1>
        <span class="title-accent" aria-hidden="true"></span>
      </header>

      <section class="project-grid" aria-label="前端作品">
        <a
          class="project-card project-card--recipe"
          data-glow="#ff775e"
          href="https://web-l-2.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="访问食谱搜索作品（在新标签页打开）"
        >
          <div class="project-media">
            <img
              src="img/RecipeFinder.png"
              alt="食谱搜索网站界面，包含搜索框和菜谱图片列表"
            />
            <span class="card-shine" aria-hidden="true"></span>
            <span class="external-icon" aria-hidden="true">↗</span>
          </div>
          <div class="project-content">
            <h2>食谱搜索</h2>
            <p>搜索世界各地的美食与菜谱，快速发现烹饪灵感。</p>
          </div>
        </a>

        <a
          class="project-card project-card--quiz"
          data-glow="#62b9bc"
          href="https://web-s-2-ecru.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="访问趣味答题作品（在新标签页打开）"
        >
          <div class="project-media">
            <img
              src="img/QuizGame.png"
              alt="趣味答题网站欢迎界面，显示 Quiz Time 和开始答题按钮"
            />
            <span class="card-shine" aria-hidden="true"></span>
            <span class="external-icon" aria-hidden="true">↗</span>
          </div>
          <div class="project-content">
            <h2>趣味答题</h2>
            <p>简洁直观的答题互动，通过即时反馈检验知识。</p>
          </div>
        </a>

        <a
          class="project-card project-card--register"
          data-glow="#83c9f2"
          href="https://web-l-1.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="访问注册页面作品（在新标签页打开）"
        >
          <div class="project-media">
            <img
              src="img/Register.png"
              alt="注册页面界面，包含用户名、邮箱和密码输入框"
            />
            <span class="card-shine" aria-hidden="true"></span>
            <span class="external-icon" aria-hidden="true">↗</span>
          </div>
          <div class="project-content">
            <h2>注册页面</h2>
            <p>结构清晰、体验友好的用户注册表单。</p>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
